version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: solvesphere_postgres
    environment:
      POSTGRES_USER: solvesphere
      POSTGRES_PASSWORD: solvesphere_password
      POSTGRES_DB: solvesphere_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvesphere -d solvesphere_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: solvesphere_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solvesphere_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://solvesphere:solvesphere_password@postgres:5432/solvesphere_db
      - SECRET_KEY=solvesphere_secret_key_sih2026_super_secure_key
      - USE_PGVECTOR=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: solvesphere_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
